    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt springen</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Startseite">
      <span class="brand-mark" aria-hidden="true">⌛</span>
      <span class="brand-text">Zeitreise<small>Geschichte · Abi Sachsen</small></span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Suche öffnen" title="Suche"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="icon-btn" id="themeBtn" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Hauptnavigation"></nav>

    <input type="search" id="searchInput" placeholder="Begriff, Person, Jahr suchen …" autocomplete="off" aria-label="Suche">
    <div id="searchResults" class="search-results"></div>
  </div>

  <main id="main" tabindex="-1"></main>

  <div class="tts-bar" id="ttsBar" hidden>
    <span class="tts-label" id="ttsLabel">Vorlesen</span>
    <button class="icon-btn" id="ttsPause" aria-label="Pause">❚❚</button>
    <label class="tts-rate">Tempo
      <select id="ttsRate"><option value="0.85">langsam</option><option value="1" selected>normal</option><option value="1.2">schnell</option></select>
    </label>
    <button class="icon-btn" id="ttsStop" aria-label="Vorlesen stoppen">■</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem">Bitte JavaScript aktivieren, um die App zu nutzen.</p></noscript>
